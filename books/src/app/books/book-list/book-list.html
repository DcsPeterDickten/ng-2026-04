@if (books.length < 10) {
  <p>Es sind nur {{ books.length }} Bücher vorhanden.</p>
}

<p>
Filter:
<input type="text" [(ngModel)]="searchValue" />
</p>

<button (click)="toggleCover()">Cover {{coverIsVisible ? 'aus':'ein'}}blenden</button>

<br />

<p>
  Liste gefiltert nach: {{ searchValue }}
</p>

<table>
  <tr>
    <td>ISBN</td>
    <td>Name</td>
    <td>Price</td>
    <td>Rating</td>
    <td></td>
  </tr>

  <!-- *ngFor="let book of books"  -->
  @for (book of books; track book.isbn) {
    <tr style="height: 120px;">
      <td>{{ book.isbn }}</td>
      <td>{{ book.name }}</td>
      <td>{{ book.price }}</td>
      <td>{{ book.rating }}</td>
      <td>
        @if (coverIsVisible) {
          <img [style.width.px]="breite" [src]="book.coverUrl" alt="Cover von {{ book.name }}" />
        }
      </td>
    </tr>
  }
</table>
