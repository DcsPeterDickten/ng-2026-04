      <path stroke-linecap="round" stroke-linejoin="round" d="M7.498 15.25H4.372c-1.026 0-1.945-.694-2.054-1.715a12.137 12.137 0 0 1-.068-1.285c0-2.848.992-5.464 2.649-7.521C5.287 4.247 5.886 4 6.504 4h4.016a4.5 4.5 0 0 1 1.423.23l3.114 1.04a4.5 4.5 0 0 0 1.423.23h1.294M7.498 15.25c.618 0 .991.724.725 1.282A7.471 7.471 0 0 0 7.5 19.5a2.25 2.25 0 0 0 2.25 2.25c.69 0 1.25-.56 1.25-1.25v-1.568a4.5 4.5 0 0 1 .117-.992l.186-.744a4.5 4.5 0 0 1 .998-1.946l.768-.88a4.5 4.5 0 0 0 1.131-2.97V9.75m0 0c-.629 0-1.135-.51-1.135-1.135v-.865c0-.378.152-.74.424-1.004A3.752 3.752 0 0 0 15 4.266V3.75A2.25 2.25 0 0 0 12.75 1.5h-.376a.75.75 0 0 0-.707.5L11 3.75" />

    (click)="plus()"
    aria-label="Bewertung erhoehen"

    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6.633 10.25c.806 0 1.533-.446 2.031-1.08a9.041 9.041 0 0 1 2.861-2.4c.723-.384 1.35-.956 1.653-1.715a4.498 4.498 0 0 0 .322-1.672V2.75a.75.75 0 0 1 .75-.75 2.25 2.25 0 0 1 2.25 2.25c0 1.152-.26 2.243-.723 3.218-.266.558.107 1.282.725 1.282m0 0H21.75a2.25 2.25 0 0 1 2.25 2.25c0 .424-.066.832-.189 1.215a2.252 2.252 0 0 1-1.082 1.358 2.252 2.252 0 0 1-.474 1.795 2.252 2.252 0 0 1-.638 2.11 2.257 2.257 0 0 1-.405 1.632A2.253 2.253 0 0 1 19.5 21H6.633" />
