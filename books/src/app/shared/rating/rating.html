<span class="rating-value">{{ stars }}</span>
<button mat-icon-button color="primary" (click)="plus()" aria-label="Bewertung erhoehen">
  <mat-icon>thumb_up</mat-icon>
</button>
<button mat-icon-button color="warn" (click)="minus()" aria-label="Bewertung verringern">
  <mat-icon>thumb_down</mat-icon>
</button>
