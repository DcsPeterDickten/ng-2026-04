<div class="max-w-sm">
  <div class="overflow-hidden rounded-2xl bg-slate-900 shadow-2xl ring-1 ring-white/10">

    <!-- Header -->
    <div class="bg-linear-to-r from-primary-700 to-primary-500 px-6 py-4">
      <div class="flex items-center gap-2">
        <svg class="h-5 w-5 text-white/80" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 15.75V18m-7.5-6.75h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25v-.008Zm0 2.25h.008v.008H8.25v-.008Zm2.25-4.5h.008v.008H10.5v-.008Zm0 2.25h.008v.008H10.5v-.008Zm0 2.25h.008v.008H10.5v-.008Zm2.25-4.5h.008v.008H12.75v-.008Zm0 2.25h.008v.008H12.75v-.008Zm2.25-4.5h.008v.008H15v-.008Zm0 2.25h.008v.008H15v-.008ZM5.25 6h13.5A2.25 2.25 0 0 1 21 8.25v9a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 17.25v-9A2.25 2.25 0 0 1 5.25 6Z" />
        </svg>
        <span class="text-sm font-semibold text-white">Taschenrechner</span>
      </div>
    </div>

    <!-- Display -->
    <div class="px-6 pt-5 pb-4">
      <div class="rounded-xl bg-slate-800 px-5 py-4 text-right ring-1 ring-white/5 mb-6">
        <span class="font-mono text-3xl font-light text-white tabular-nums">{{ result }}</span>
      </div>

      <!-- Inputs -->
      <div class="flex flex-col gap-3 mb-5">
        <div class="flex items-center gap-3">
          <span class="w-5 shrink-0 text-center text-xs font-bold uppercase tracking-widest text-slate-500">X</span>
          <input
            type="number"
            [(ngModel)]="x"
            class="w-full rounded-lg bg-slate-800 px-4 py-2.5 text-right font-mono text-white ring-1 ring-white/10 outline-none transition-all focus:ring-2 focus:ring-primary-500"
          />
        </div>
        <div class="flex items-center gap-3">
          <span class="w-5 shrink-0 text-center text-xs font-bold uppercase tracking-widest text-slate-500">Y</span>
          <input
            type="number"
            [(ngModel)]="y"
            class="w-full rounded-lg bg-slate-800 px-4 py-2.5 text-right font-mono text-white ring-1 ring-white/10 outline-none transition-all focus:ring-2 focus:ring-primary-500"
          />
        </div>
      </div>

      <!-- Buttons -->
      <div class="grid grid-cols-3 gap-2.5">
        <button
          (click)="add()"
          class="rounded-xl bg-primary-600 py-3 text-xl font-bold text-white shadow-md transition-all hover:bg-primary-500 active:scale-95 active:shadow-inner">
          +
        </button>
        <button
          (click)="subtract()"
          class="rounded-xl bg-primary-600 py-3 text-xl font-bold text-white shadow-md transition-all hover:bg-primary-500 active:scale-95 active:shadow-inner">
          −
        </button>
        <button
          (click)="clear()"
          class="rounded-xl bg-rose-600 py-3 text-xl font-bold text-white shadow-md transition-all hover:bg-rose-500 active:scale-95 active:shadow-inner">
          C
        </button>
      </div>
    </div>
  </div>
</div>
