<div class="calc">
  <div class="display">{{ result }}</div>

  <div class="inputs">
    <label>
      <span>X</span>
      <input type="number" [(ngModel)]="x" />
    </label>
    <label>
      <span>Y</span>
      <input type="number" [(ngModel)]="y" />
    </label>
  </div>

  <div class="buttons">
    <button class="op" (click)="add()">+</button>
    <button class="op" (click)="subtract()">&minus;</button>
    <button class="clear" (click)="clear()">C</button>
  </div>
</div>
