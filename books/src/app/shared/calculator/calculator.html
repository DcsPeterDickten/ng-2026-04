<mat-card class="calc-card">
  <mat-card-header>
    <mat-icon mat-card-avatar>calculate</mat-icon>
    <mat-card-title>Taschenrechner</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="display">{{ result }}</div>

    <div class="inputs">
      <mat-form-field appearance="outline">
        <mat-label>X</mat-label>
        <input matInput type="number" [(ngModel)]="x">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Y</mat-label>
        <input matInput type="number" [(ngModel)]="y">
      </mat-form-field>
    </div>

    <div class="buttons">
      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon> Plus
      </button>
      <button mat-raised-button color="accent" (click)="subtract()">
        <mat-icon>remove</mat-icon> Minus
      </button>
      <button mat-raised-button color="warn" (click)="clear()">
        <mat-icon>clear</mat-icon> Clear
      </button>
    </div>
  </mat-card-content>
</mat-card>
